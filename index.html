<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIMHABEEN · Hover Gallery Editor V14</title><style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:#fff;color:#202020;font:14px/1.6 Arial,'Apple SD Gothic Neo',sans-serif}.wrap{max-width:1460px;margin:auto;padding:28px 20px 60px}h1{font-size:22px;font-weight:600;margin:0 0 6px}.help{color:#646464;font-size:13px;margin:0 0 18px}.panel{background:#f8f8f8;border:1px solid #e4e4e4;border-radius:12px;padding:16px;margin-bottom:28px}.entry{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;align-items:end;gap:9px;padding:12px 0;border-bottom:1px solid #e7e7e7}.entry:last-child{border-bottom:0}label{display:block;font-size:12px;color:#555}input{display:block;width:100%;min-width:0;padding:10px;border:1px solid #cecece;border-radius:7px;background:#fff;font-size:12px;margin-top:4px}button{cursor:pointer;border:1px solid #cfcfcf;border-radius:7px;background:#fff;color:#222;padding:10px 13px;font-weight:600}.primary{background:#222;color:#fff;border-color:#222}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.note{font-size:12px;color:#737373;margin-top:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.tile{min-width:0}.thumb{display:block;position:relative;aspect-ratio:16/9;background:#edf0f3;overflow:hidden;border-radius:8px;isolation:isolate}.thumb img{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;transition:opacity .55s ease,transform .55s ease}.thumb .hover{opacity:0}.thumb.has-hover:hover .hover,.thumb.has-hover:focus-visible .hover{opacity:1}.thumb.has-hover:hover .normal,.thumb.has-hover:focus-visible .normal{opacity:0}.thumb:hover img,.thumb:focus-visible img{transform:scale(1.025)}.thumb:focus-visible{outline:2px solid #5784b9;outline-offset:2px}.placeholder{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:12px;color:#78828e;font-size:12px;pointer-events:none}.num{color:#999;font-size:11px;margin-top:5px}.warning{font-size:12px;color:#a64b3c;margin-top:5px;min-height:18px}.section-title{font-size:13px;font-weight:600;margin:0 0 12px}@media(max-width:700px){.grid{grid-template-columns:1fr;gap:16px}.entry{grid-template-columns:1fr}.wrap{padding:20px 14px 40px}}@media(prefers-reduced-motion:reduce){.thumb img{transition:none}}
</style></head><body><main class="wrap"><section id="editor"><h1>Hover Gallery · V14</h1><p class="help">PC 가로 3열 / 모바일 1열 · 16:9 · 기본 이미지 + 호버 이미지 크로스 디졸브 · 이미지와 링크만 입력</p><div class="panel"><div id="entries"></div><div class="toolbar"><button id="add">+ 카드 추가</button><button id="save">설정 저장 (.json)</button><button id="loadBtn">설정 불러오기</button><input type="file" id="load" accept="application/json" hidden><button id="export" class="primary">Google Sites 삽입용 HTML 다운로드</button></div><p class="note">이미지 주소는 브라우저에서 열었을 때 사진만 표시되는 직접 이미지 URL이어야 합니다. Google Sites 페이지 주소 또는 Google Drive 공유 페이지 링크를 붙여넣으면 사진이 표시되지 않습니다.</p></div></section><h2 class="section-title">미리보기</h2><div id="gallery" class="grid"></div></main><script>
let projects=Array.from({length:6},()=>({normal:'',hover:'',url:''}));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const http=s=>/^https?:\/\//i.test(String(s||'').trim());
const suspect=s=>/^(https?:\/\/)?(sites\.google\.com\/view\/|drive\.google\.com\/file\/d\/|drive\.google\.com\/open\?)/i.test(String(s||'').trim());
function one(p,i){let href=http(p.url)?p.url:'#';return `<article class="tile"><a class="thumb" href="${esc(href)}" ${href==='#'?'onclick="return false"':'target="_blank" rel="noopener noreferrer"'} aria-label="프로젝트 ${i+1}"><span class="placeholder">이미지 주소를 입력해 주세요</span>${http(p.normal)?`<img class="normal" src="${esc(p.normal)}" alt="프로젝트 ${i+1}" loading="lazy" decoding="async" data-role="normal">`:''}${http(p.hover)?`<img class="hover" src="${esc(p.hover)}" alt="" loading="lazy" decoding="async" data-role="hover">`:''}</a><div class="num">${String(i+1).padStart(2,'0')}</div><div class="warning" aria-live="polite"></div></article>`}
function setState(){document.querySelectorAll('.tile').forEach(tile=>{const box=tile.querySelector('.thumb'),normal=tile.querySelector('img.normal'),hover=tile.querySelector('img.hover'),msg=tile.querySelector('.warning'),placeholder=tile.querySelector('.placeholder');let baseOK=false,hoverOK=false;const update=()=>{box.classList.toggle('has-hover',baseOK&&hoverOK);if(normal){normal.style.visibility=baseOK?'visible':'hidden'}if(hover){hover.style.visibility=hoverOK?'visible':'hidden'}placeholder.style.display=baseOK?'none':'grid';msg.textContent=normal&&!baseOK&&normal.complete?'기본 이미지 로드 실패 · 직접 이미지 주소/접근 권한 확인':hover&&!hoverOK&&hover.complete?'호버 이미지 로드 실패 · 기본 이미지는 유지됩니다':''};if(normal){normal.addEventListener('load',()=>{baseOK=true;update()});normal.addEventListener('error',()=>{baseOK=false;update()});if(normal.complete){baseOK=normal.naturalWidth>0}}if(hover){hover.addEventListener('load',()=>{hoverOK=true;update()});hover.addEventListener('error',()=>{hoverOK=false;update()});if(hover.complete){hoverOK=hover.naturalWidth>0}}update()})}
function draw(){document.querySelector('#gallery').innerHTML=projects.map(one).join('');setState()}
function controls(){document.querySelector('#entries').innerHTML=projects.map((p,i)=>`<div class="entry"><label>${i+1} · 기본 이미지 URL<input data-i="${i}" data-field="normal" value="${esc(p.normal)}" placeholder="https://.../thumbnail.webp"></label><label>호버 이미지 URL<input data-i="${i}" data-field="hover" value="${esc(p.hover)}" placeholder="https://.../hover.webp"></label><label>클릭 링크<input data-i="${i}" data-field="url" value="${esc(p.url)}" placeholder="https://sites.google.com/..."></label><button data-delete="${i}" type="button">삭제</button></div>`).join('');document.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('change',()=>{projects[+el.dataset.i][el.dataset.field]=el.value.trim();draw()}));document.querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=()=>{projects.splice(+btn.dataset.delete,1);controls();draw()})}
function download(data,name,type){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
document.querySelector('#add').onclick=()=>{projects.push({normal:'',hover:'',url:''});controls();draw()};document.querySelector('#save').onclick=()=>download(JSON.stringify(projects,null,2),'kimhabeen_hover_cards.json','application/json');document.querySelector('#loadBtn').onclick=()=>document.querySelector('#load').click();document.querySelector('#load').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j))throw Error();projects=j.map(p=>({normal:String(p.normal||''),hover:String(p.hover||''),url:String(p.url||'')}));controls();draw()}catch{alert('올바른 설정 JSON 파일을 선택해 주세요.')}};
document.querySelector('#export').onclick=()=>{let css=document.querySelector('style').textContent;let js=`(${setState.toString()})();`;let result=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${css}</style></head><body><main class="wrap"><div class="grid">${projects.map(one).join('')}</div></main><script>${js}<\/script></body></html>`;download(result,'kimhabeen_google_sites_hover_embed.html','text/html;charset=utf-8')};controls();draw();
</script></body></html>
